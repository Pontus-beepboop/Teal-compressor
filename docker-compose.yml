services:
  blue-compressor:
    image: ghcr.io/redn3/blue-compressor:latest
    container_name: blue-compressor
    restart: unless-stopped
    ports:
      - "9847:9847"
    environment:
      - PORT=9847
      - BROWSE_ROOT=/
      - WATCH_ENABLED=true
      - WATCH_INPUT=/watch/in
      - WATCH_OUTPUT=/watch/out
      - WATCH_QUALITY=3
      - WATCH_RESOLUTION=original
      - WATCH_POLL_SECONDS=5
    volumes:
      # Mount your NAS video share so you can browse and compress clips in the Web UI:
      - /volume1/video:/media
      # Optional watch folders: clips copied into watch-in are compressed into watch-out:
      - /volume1/video/watch-in:/watch/in
      - /volume1/video/watch-out:/watch/out
