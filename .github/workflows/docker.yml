name: Docker

# Builds and publishes the multi-arch (linux/amd64 and linux/arm64) Docker image to
# GitHub Container Registry (ghcr.io/redn3/blue-compressor) on release tags or manual dispatch.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional version tag to publish alongside latest (e.g. v0.1.3)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            slug: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            slug: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: meta
        run: |
          IMAGE="${REGISTRY}/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docker-${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.slug }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    needs: build
    name: Publish multi-arch manifest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and inspect multi-arch manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' "${GITHUB_WORKSPACE}/Cargo.toml" | head -n 1)
          TAGS=("-t" "${IMAGE}:latest")
          if [ -n "${VERSION}" ]; then
            TAGS+=("-t" "${IMAGE}:v${VERSION}" "-t" "${IMAGE}:${VERSION}")
          fi
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" == v* ]]; then
            V="${GITHUB_REF_NAME#v}"
            TAGS+=("-t" "${IMAGE}:${GITHUB_REF_NAME}" "-t" "${IMAGE}:${V}")
          fi
          INPUT_TAG="${{ github.event.inputs.tag }}"
          if [ -n "${INPUT_TAG}" ]; then
            V="${INPUT_TAG#v}"
            TAGS+=("-t" "${IMAGE}:${INPUT_TAG}" "-t" "${IMAGE}:v${V}" "-t" "${IMAGE}:${V}")
          fi
          docker buildx imagetools create "${TAGS[@]}" $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:latest"
