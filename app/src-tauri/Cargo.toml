[package]
name = "blue-compressor-app"
description = "Blue Compressor desktop app"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"

[lib]
name = "blue_compressor_app"
crate-type = ["rlib"]

[[bin]]
name = "blue-compressor"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bluecompress = { path = "../../crates/core" }

# OpenCL GPU resizing (AMD) on Windows and Linux. The OpenCL loader is opened at run time,
# so machines without a GPU driver just use the CPU.
[target.'cfg(not(target_os = "macos"))'.dependencies]
bluecompress = { path = "../../crates/core", features = ["opencl"] }

[features]
# Fakes probe/transcode with realistic numbers, for UI work without the real core.
mock = []
